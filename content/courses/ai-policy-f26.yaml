slug: ai-policy-f26
code: CMSC 848Y
term: Fall 2026
title: AI, Public Policy, and Society
summary: How does AI shape society? Conversely, how should society shape AI? We examine how policy shapes technology and how technology shapes policy.
format: Seminar
meetingTime: Mondays and Wednesdays, 3:00-4:15 PM ET
location: ESJ 0215
instructor: Ritwik Gupta
officeHours: Thursdays 2:00-3:00 PM ET at IRB 5126
ta: null

descriptionHeading: Integrating AI with society with effective policy.
description:
  - This course is for AI Ph.D. and M.S. students who want to understand how their research relates to public policy. The goal is for students to become policy-literate AI researchers who can advise decision makers.
  - Most of the course will focus on AI. We will also study other engineering fields which have had massive policy impacts to see how others have contended with national security, scientific self-governance, public participation, and international regulation.
  - The course will alternate between seminar discussions, policy exercises, writing workshops, and guest lectures. Students will use ideas from political science, international relations, and public policy to analyze technical research and its consequences.

assignmentsHeading: Assignments.
assignmentsNote: Students will write four response papers during the semester. Papers may address any course topic and do not need to build on one another. We will discuss possible paper topics during class; no separate topic proposal is due.

assignments:

  - title: Seminar preparation and participation
    due: Ongoing
    weight: 20
    description: |
      Students are expected to complete the readings and participate in seminar discussions and policy exercises. When reading technical papers, students should be prepared to discuss five questions:

      1. What was technically novel?
      2. What capability, cost, or bottleneck changed?
      3. What assumptions and evaluation conditions limit the result?
      4. What changes when the method is deployed outside the paper?
      5. Which policy claims follow from the paper, and which do not?

      When reading policy papers, students should be prepared to discuss five corresponding questions:

      1. How is the policy problem being defined?
      2. What causal mechanism does the author claim?
      3. Who has authority to act?
      4. What instrument is proposed, and what constrains implementation?
      5. Who benefits, who bears the costs, and what evidence could change the conclusion?

  - title: Response papers
    due: September 16, October 14, November 4, and December 9, 2026
    weight: 80
    description: |
      Students will submit four response papers, each worth an equal share of the response-paper grade. Each paper may address any topic raised by the course. Students may focus on one reading, connect several readings from the same week, or develop an argument that draws on material from across the course.
      Response papers should go beyond summarizing the readings. A paper might critically assess an author's argument, explain how two or more readings relate to one another, develop an original causal claim, identify an important unanswered question, propose a way to study that question, or offer a policy recommendation.
      Each response paper should be no longer than four pages, approximately 1,000-1,200 words, double-spaced with 12-point font and 1-inch margins. Papers are due by midnight on the assigned class day.

